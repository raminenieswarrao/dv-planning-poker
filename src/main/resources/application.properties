spring.application.name=dv-planning-poker

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0

# Render terminates HTTPS in front of the Spring Boot service.
# Respect forwarded protocol / host headers correctly.
server.forward-headers-strategy=framework


# =========================================================
# ERROR INFORMATION SECURITY
# =========================================================

# Never expose Java exception details, stack traces,
# binding errors, or internal implementation information
# in HTTP error responses.

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# =========================================================
# REQUEST LIMITS
# =========================================================

# This application needs only small HTTP headers.
# Restrict oversized-header attacks.
server.max-http-request-header-size=8KB


# =========================================================
# FILE UPLOAD PROTECTION
# =========================================================

# Refinement Poker has no file/image upload feature.
# Disable multipart processing entirely.
#
# This prevents the application from accidentally accepting
# multipart file uploads now or through an unintended endpoint.

spring.servlet.multipart.enabled=false