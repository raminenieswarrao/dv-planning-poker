spring.application.name=dv-planning-poker

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0

# Render terminates HTTPS in front of the Spring Boot service.
# Respect forwarded protocol / host headers correctly.
server.forward-headers-strategy=framework


# =========================================================
# ERROR INFORMATION SECURITY
# =========================================================

# Never expose Java exception details, stack traces,
# binding errors, or internal implementation information
# in HTTP error responses.

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# =========================================================
# REQUEST LIMITS
# =========================================================

# This application needs only small HTTP headers.
# Restrict oversized-header attacks.

server.max-http-request-header-size=8KB


# =========================================================
# FILE UPLOAD PROTECTION
# =========================================================

# Refinement Poker has no file/image upload feature.
# Disable multipart processing entirely.

spring.servlet.multipart.enabled=false


# =========================================================
# SUPABASE
# =========================================================

# Never commit real Supabase keys to GitHub.
#
# Configure these through:
#
# Local:
# IntelliJ -> Run Configuration -> Environment Variables
#
# Production:
# Render -> Environment
#
#
# SUPABASE_URL
# Example:
# https://xxxxxxxxxxxxxxxxxxxx.supabase.co
#
#
# SUPABASE_PUBLISHABLE_KEY
# Used for the existing authenticated Supabase flows.
#
#
# SUPABASE_SECRET_KEY
# SERVER ONLY.
#
# Used by Spring Boot for the public homepage APIs:
#
# GET /api/public/tournaments/recent
# GET /api/public/pickleball/scoreboard
#
# The browser NEVER receives this key.

# =========================================================
# SUPABASE
# =========================================================

supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
